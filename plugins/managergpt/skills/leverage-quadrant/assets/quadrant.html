<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leverage Quadrant</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; padding: 20px; color: #1a1a1a; background: #fff; }
  @media (prefers-color-scheme: dark){ body{ color:#ececec; background:#1a1a1a; } .card{ background:#242424; border-color:#3a3a3a;} .chip{background:#2e2e2e;} }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  .sub { font-size: 13px; opacity: .65; margin: 0 0 18px; }
  .wrap { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; }
  .col { flex: 1; min-width: 300px; }
  .row { margin-bottom: 14px; }
  .row .name { font-size: 13px; font-weight: 600; margin-bottom: 4px; display:flex; justify-content:space-between; align-items:center; }
  .row .name button { border:none; background:none; opacity:.4; cursor:pointer; font-size:14px; }
  .slider { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
  .slider label { font-size: 11px; opacity: .6; width: 60px; }
  .slider input { flex: 1; }
  .slider .val { font-size: 11px; width: 26px; text-align: right; }
  svg { max-width: 380px; width: 100%; touch-action: none; }
  .controls { margin-top: 14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  button.primary { font-size: 14px; padding: 9px 16px; border-radius: 8px; border: 1px solid #2b6; background:#2b6; color:#fff; cursor: pointer; }
  button.ghost { font-size: 13px; padding: 8px 12px; border-radius: 8px; border: 1px solid #ccc; background: transparent; color: inherit; cursor: pointer; }
  #status { font-size: 12px; opacity: .7; }
</style>
</head>
<body>
<h1>Leverage Quadrant</h1>
<p class="sub">Set each item's impact and how shareable it is — drag the dot or move the sliders. Top-left is Do this, top-right is Delegate.</p>

<div class="wrap">
  <div class="col"><div id="rows"></div>
    <button class="ghost" id="add">+ Add item</button>
  </div>
  <div class="col">
    <svg id="plot" viewBox="0 0 380 380" aria-label="Leverage quadrant">
      <rect x="40" y="20" width="160" height="160" fill="#2b6" opacity="0.12"/>
      <rect x="200" y="20" width="160" height="160" fill="#37a" opacity="0.12"/>
      <rect x="40" y="180" width="160" height="160" fill="#888" opacity="0.10"/>
      <rect x="200" y="180" width="160" height="160" fill="#888" opacity="0.10"/>
      <line x1="200" y1="20" x2="200" y2="340" stroke="#999" stroke-width="0.5"/>
      <line x1="40" y1="180" x2="360" y2="180" stroke="#999" stroke-width="0.5"/>
      <text x="120" y="40" text-anchor="middle" font-size="11" font-weight="600" fill="#2b6">do this</text>
      <text x="280" y="40" text-anchor="middle" font-size="11" font-weight="600" fill="#37a">delegate</text>
      <text x="120" y="332" text-anchor="middle" font-size="11" fill="#999">be careful</text>
      <text x="280" y="332" text-anchor="middle" font-size="11" fill="#999">minimize</text>
      <text x="200" y="365" text-anchor="middle" font-size="11" fill="currentColor" opacity=".6">only me  ·  others can do →</text>
      <text x="14" y="180" text-anchor="middle" font-size="11" fill="currentColor" opacity=".6" transform="rotate(-90 14 180)">low impact  ·  high impact ↑</text>
      <g id="dots"></g>
    </svg>
  </div>
</div>

<div class="controls">
  <button class="primary" id="complete">Complete and prep delegation</button>
  <span id="status"></span>
</div>

<script>
const DEFAULT = [
  {n:"Example project A", imp:80, oth:20},
  {n:"Example project B", imp:70, oth:70},
  {n:"Example project C", imp:30, oth:40}
];
let items = (window.LQ_ITEMS && window.LQ_ITEMS.length) ? window.LQ_ITEMS.slice() : null;

const rows = document.getElementById('rows');
const svg = document.getElementById('plot');
const dots = document.getElementById('dots');
const statusEl = document.getElementById('status');

function quad(it){return it.imp>=50?(it.oth<50?"Do this":"Delegate"):(it.oth<50?"Be careful":"Minimize");}
function colOf(it){return it.imp>=50?(it.oth<50?"#2b6":"#37a"):"#999";}

function drawRows(){
  rows.innerHTML="";
  items.forEach((it,i)=>{
    const d=document.createElement('div'); d.className="row";
    d.innerHTML=`<div class="name"><span>${it.n}</span><button data-del="${i}" title="remove">✕</button></div>
      <div class="slider"><label>impact</label><input type="range" min="0" max="100" step="1" value="${it.imp}" data-imp="${i}"><span class="val" data-impv="${i}">${it.imp}</span></div>
      <div class="slider"><label>others can</label><input type="range" min="0" max="100" step="1" value="${it.oth}" data-oth="${i}"><span class="val" data-othv="${i}">${it.oth}</span></div>`;
    rows.appendChild(d);
  });
  rows.querySelectorAll('[data-imp]').forEach(el=>el.addEventListener('input',e=>{const i=+e.target.dataset.imp;items[i].imp=+e.target.value;rows.querySelector(`[data-impv="${i}"]`).textContent=Math.round(items[i].imp);draw();}));
  rows.querySelectorAll('[data-oth]').forEach(el=>el.addEventListener('input',e=>{const i=+e.target.dataset.oth;items[i].oth=+e.target.value;rows.querySelector(`[data-othv="${i}"]`).textContent=Math.round(items[i].oth);draw();}));
  rows.querySelectorAll('[data-del]').forEach(el=>el.addEventListener('click',e=>{items.splice(+e.target.dataset.del,1);drawRows();draw();}));
}
function draw(){
  dots.innerHTML="";
  items.forEach((it,i)=>{
    const x=40+it.oth/100*320, y=340-it.imp/100*320;
    dots.innerHTML+=`<circle data-i="${i}" cx="${x}" cy="${y}" r="8" fill="${colOf(it)}" style="cursor:grab"/>`+
      `<text x="${x+11}" y="${y+4}" font-size="10.5" fill="currentColor" style="pointer-events:none">${it.n}</text>`;
  });
}
function syncRow(i){
  rows.querySelector(`[data-imp="${i}"]`).value=items[i].imp;
  rows.querySelector(`[data-impv="${i}"]`).textContent=Math.round(items[i].imp);
  rows.querySelector(`[data-oth="${i}"]`).value=items[i].oth;
  rows.querySelector(`[data-othv="${i}"]`).textContent=Math.round(items[i].oth);
}
let active=null;
svg.addEventListener('pointerdown',e=>{ if(e.target.dataset && e.target.dataset.i!==undefined){active=+e.target.dataset.i;svg.setPointerCapture(e.pointerId);e.preventDefault();}});
svg.addEventListener('pointermove',e=>{
  if(active===null)return;
  const r=svg.getBoundingClientRect();
  let sx=(e.clientX-r.left)/r.width*380, sy=(e.clientY-r.top)/r.height*380;
  sx=Math.max(40,Math.min(360,sx)); sy=Math.max(20,Math.min(340,sy));
  items[active].oth=Math.round((sx-40)/320*100);
  items[active].imp=Math.round((340-sy)/320*100);
  syncRow(active); draw();
});
svg.addEventListener('pointerup',()=>{active=null;});
document.getElementById('add').addEventListener('click',()=>{const name=prompt("Name this project or task:");if(name){items.push({n:name,imp:50,oth:50});drawRows();draw();}});

function download(fn,txt){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=fn;a.click();}
document.getElementById('complete').addEventListener('click',async()=>{
  const payload=items.map(it=>({name:it.n,impact:Math.round(it.imp),others_can_do:Math.round(it.oth),quadrant:quad(it)}));
  const summary="Here's how I placed my work on the Leverage Quadrant:\n"+
    payload.map(p=>`- ${p.name}: ${p.quadrant} (impact ${p.impact}, others-can-do ${p.others_can_do})`).join("\n")+
    "\n\nFor everything in Delegate, prep a Clean Handoff and track it as Waiting For; for Do this, help me protect Deep Work.";
  if(typeof sendPrompt==="function"){ sendPrompt(summary); statusEl.textContent="Sent — continue in chat."; return; }
  try{ const r=await fetch('./save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); if(r.ok){ statusEl.textContent="Saved — the agent can read your placements now."; return; } }catch(e){}
  download('placements.json',JSON.stringify(payload,null,2));
  statusEl.textContent="Downloaded placements.json — share it back with the agent.";
});

(async function init(){
  if(!items){ try{ const r=await fetch('./items.json'); if(r.ok){ items=await r.json(); } }catch(e){} }
  if(!items) items=DEFAULT.slice();
  drawRows(); draw();
})();
</script>
</body>
</html>
